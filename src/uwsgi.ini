[uwsgi]
# So uwsgi knows where to mount the app
chdir = /usr/src/app/src

# Application's callbale
module = wsgi:application

# Centralize logging through the master process
log-master=true
logto = /usr/src/app/log/uwsgi-hs-ontology-api.log

# Master with 4 worker process (based on CPU number)
master = true
processes = 4

# Enable multithreading
enable-threads = true

# Use http socket for integration with gateway nginx running on the same machine
socket = :5000

# Enable socket cleanup when process stop
vacuum = true

# Ensure compatibility with init system
die-on-term = true
